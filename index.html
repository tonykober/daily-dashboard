<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日資訊儀表板</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--card-bg:#0d1117}
[data-theme="light"]{--bg:#f6f8fa;--surface:#fff;--border:#d0d7de;--text:#1f2328;--muted:#656d76;--accent:#0969da;--card-bg:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px;min-height:100vh;transition:background .3s,color .3s}
header{max-width:1200px;margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
h1{font-size:36px;color:var(--accent)}
.header-right{display:flex;align-items:center;gap:8px}
.theme-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:1em}
.search-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:var(--text);font-size:0.9em;width:200px}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;max-width:1200px;margin:0 auto 16px}
.date-nav{display:flex;align-items:center;gap:8px}
.date-nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer}
.date-nav button:hover{border-color:var(--accent)}
.date-nav span{font-size:16px;min-width:110px;text-align:center}
.tabs{display:flex;gap:3px;background:var(--surface);border-radius:8px;padding:3px;border:1px solid var(--border);flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:14px;border:none;color:var(--muted);background:transparent;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){color:var(--text)}
.stats{max-width:1200px;margin:0 auto 16px;display:flex;gap:12px;flex-wrap:wrap}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:16px;color:var(--muted)}
.stat-card strong{color:var(--text);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:1200px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s,transform .2s;cursor:pointer;text-decoration:none;color:inherit;display:block;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-img{width:100%;height:140px;background:var(--card-bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img .placeholder{font-size:2.5em;opacity:0.3}
.card-body{padding:10px 12px}
.card-body .title{font-weight:600;font-size:16px;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-body .desc{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:14px;padding:2px 6px;border-radius:10px;margin-bottom:4px}
.tag-news{background:#1f3a2a;color:#3fb950}
.tag-video{background:#2a1f3a;color:#a371f7}
[data-theme="light"] .tag-news{background:#dafbe1;color:#1a7f37}
[data-theme="light"] .tag-video{background:#ede3fb;color:#8250df}
.bookmark-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.bookmark-btn.saved{background:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:1em;grid-column:1/-1}
.heat{display:inline-block;font-size:12px;margin-left:4px;color:#f0883e}
.stock-briefing{max-width:1200px;margin:0 auto 16px;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:16px 20px}
.stock-briefing h2{font-size:18px;color:var(--accent);margin-bottom:12px}
.stock-briefing .sb-section{margin-bottom:10px}
.stock-briefing .sb-label{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.stock-briefing .sb-item{font-size:14px;color:var(--text);padding:3px 0;border-bottom:1px solid var(--border)}
.stock-briefing .sb-item .trend-up{color:#f85149}
.stock-briefing .sb-item .trend-down{color:#3fb950}
.stock-briefing .sb-item .trend-flat{color:var(--muted)}
.stock-briefing .sb-summary{font-size:14px;color:var(--muted);margin-top:8px;padding:8px;background:var(--bg);border-radius:6px}
.stock-briefing .sb-event{font-size:13px;color:#d29922;padding:2px 0}
</style>
</head>
<body>
<header>
  <h1>📊 每日資訊儀表板</h1>
  <div class="header-right">
    <input class="search-box" id="search" placeholder="🔍 搜尋..." />
    <button class="theme-btn" id="themeToggle">🌙</button>
  </div>
</header>
<div class="controls">
  <div class="date-nav">
    <button id="prev">◀</button>
    <span id="dateLabel"></span>
    <button id="next">▶</button>
  </div>
  <div class="tabs" id="tabsContainer">
    <button class="tab active" data-tab="ai">🤖 AI</button>
    <button class="tab" data-tab="gaming">🎮 遊戲</button>
    <button class="tab" data-tab="art">🎨 美術</button>
    <button class="tab" data-tab="tech">💻 科技</button>
    <button class="tab" data-tab="crypto">🪙 加密貨幣</button>
    <button class="tab" data-tab="dev">⚙️ 程式開發</button>
    <button class="tab" data-tab="design">🎨 設計</button>
    <button class="tab" data-tab="business">💼 商業</button>
    <button class="tab" data-tab="finance">📈 財經</button>
    <button class="tab" data-tab="bookmarks">⭐ 收藏</button>
  </div>
</div>
<div class="stats" id="stats"></div>
<div id="stockBriefing"></div>
<div class="grid" id="content"></div>
<script>
let dates=[],dateIdx=0,currentTab='ai',cache={},bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'[]'),searchQuery='';
function getThumb(item){
  if(item.image)return item.image;
  if(item.type==='video'&&item.url.includes('youtube.com/watch')){
    const id=new URL(item.url).searchParams.get('v');
    if(id)return 'https://img.youtube.com/vi/'+id+'/mqdefault.jpg';
  }
  if(item.url.includes('ign.com/videos'))return 'https://logo.clearbit.com/ign.com';
  return 'https://image.thum.io/get/width/400/crop/160/'+item.url;
}
function getHeat(title){let h=0;for(let i=0;i<title.length;i++)h=((h<<5)-h)+title.charCodeAt(i);return Math.abs(h%5)+1}
function toggleBookmark(item,e){
  e.preventDefault();e.stopPropagation();
  const idx=bookmarks.findIndex(b=>b.url===item.url);
  if(idx>=0)bookmarks.splice(idx,1);else bookmarks.push(item);
  localStorage.setItem('bookmarks',JSON.stringify(bookmarks));
  render();
}
function isBookmarked(url){return bookmarks.some(b=>b.url===url)}
async function init(){
  dates=(await(await fetch('data/index.json')).json()).sort().reverse();
  if(!dates.length){document.getElementById('content').innerHTML='<div class="empty">尚無資料</div>';return}
  const today=new Date().toISOString().split('T')[0];
  const todayIdx=dates.indexOf(today);
  dateIdx=todayIdx>=0?todayIdx:0;
  render();
}
async function loadDate(d){
  if(!cache[d])cache[d]=await(await fetch('data/'+d+'.json')).json();
  return cache[d];
}
function renderStockBriefing(cats){
  const el=document.getElementById('stockBriefing');
  if(currentTab!=='finance'||!cats||!cats.stock_briefing){el.innerHTML='';return}
  const sb=cats.stock_briefing;
  let h='<div class="stock-briefing"><h2>📊 台股操盤 — '+sb.date+'</h2>';
  if(sb.stocks&&sb.stocks.length){h+='<div class="sb-section"><div class="sb-label">個股動向</div>';sb.stocks.forEach(s=>{const cls=s.trend.includes('漲')||s.trend.includes('多')?'trend-up':s.trend.includes('跌')||s.trend.includes('空')?'trend-down':'trend-flat';h+='<div class="sb-item"><span class="'+cls+'">'+s.name+' '+s.trend+'</span> — '+s.note+'</div>'});h+='</div>'}
  if(sb.etf&&sb.etf.length){h+='<div class="sb-section"><div class="sb-label">ETF趨勢</div>';sb.etf.forEach(s=>{const cls=s.trend.includes('漲')||s.trend.includes('多')?'trend-up':s.trend.includes('跌')||s.trend.includes('空')?'trend-down':'trend-flat';h+='<div class="sb-item"><span class="'+cls+'">'+s.name+' '+s.trend+'</span> — '+s.note+'</div>'});h+='</div>'}
  if(sb.events&&sb.events.length){h+='<div class="sb-section"><div class="sb-label">⚡ 突發事件</div>';sb.events.forEach(e=>{h+='<div class="sb-event">• '+e+'</div>'});h+='</div>'}
  if(sb.summary){h+='<div class="sb-summary">💡 '+sb.summary+'</div>'}
  h+='</div>';el.innerHTML=h;
}
function renderStats(cats){
  let news=0,videos=0;
  Object.keys(cats).forEach(k=>{if(Array.isArray(cats[k]))cats[k].forEach(i=>{if(i.type==='video')videos++;else news++})});
  document.getElementById('stats').innerHTML=`<div class="stat-card">📰 新聞 <strong>${news}</strong></div><div class="stat-card">🎬 影片 <strong>${videos}</strong></div><div class="stat-card">⭐ 收藏 <strong>${bookmarks.length}</strong></div>`;
}
async function render(){
  const d=dates[dateIdx];
  document.getElementById('dateLabel').textContent=d;
  document.getElementById('prev').disabled=dateIdx>=dates.length-1;
  document.getElementById('next').disabled=dateIdx<=0;
  let items;
  if(currentTab==='bookmarks'){items=bookmarks}
  else{const data=await loadDate(d);const cats=data.categories||data;items=cats[currentTab]||[];if(currentTab==='ai'&&cats.ai_videos)items=items.concat(cats.ai_videos);renderStats(cats);renderStockBriefing(cats)}
  if(searchQuery){const q=searchQuery.toLowerCase();items=items.filter(i=>(i.title+' '+(i.desc||'')).toLowerCase().includes(q))}
  if(!items.length){document.getElementById('content').innerHTML='<div class="empty">'+(currentTab==='bookmarks'?'尚無收藏':'該分類尚無資料')+'</div>';return}
  let html='';
  items.forEach(item=>{
    const tag=item.type==='video'?'<span class="tag tag-video">影片</span>':'<span class="tag tag-news">新聞</span>';
    const thumb=getThumb(item);
    const imgHtml=`<img src="${thumb}" onerror="this.style.display='none';this.parentElement.style.background='var(--surface)';this.parentElement.innerHTML='<div class=placeholder>'+(item.type==='video'?'🎬':'📰')+'</div>'">`;
    const bm=isBookmarked(item.url)?'saved':'';
    const heat='🔥'.repeat(getHeat(item.title));
    html+=`<a class="card" href="${item.url}" target="_blank"><button class="bookmark-btn ${bm}" onclick="toggleBookmark(${JSON.stringify(item).replace(/"/g,'&quot;')},event)">⭐</button><div class="card-body">${tag}<span class="heat">${heat}</span><div class="title">${item.title}</div><div class="desc">${item.desc||''}</div></div></a>`;
  });
  document.getElementById('content').innerHTML=html;
}
document.getElementById('prev').onclick=()=>{if(dateIdx<dates.length-1){dateIdx++;render()}};
document.getElementById('next').onclick=()=>{if(dateIdx>0){dateIdx--;render()}};
document.getElementById('tabsContainer').onclick=e=>{
  if(!e.target.classList.contains('tab'))return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  e.target.classList.add('active');
  currentTab=e.target.dataset.tab;
  render();
};
document.getElementById('search').oninput=e=>{searchQuery=e.target.value;render()};
document.getElementById('themeToggle').onclick=()=>{
  const html=document.documentElement;
  const isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',isDark?'light':'dark');
  document.getElementById('themeToggle').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('theme',isDark?'light':'dark');
};
if(localStorage.getItem('theme')==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeToggle').textContent='☀️'}
init();
</script>
</body>
</html>
