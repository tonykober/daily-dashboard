<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日資訊儀表板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px;min-height:100vh}
h1{text-align:center;margin-bottom:8px;font-size:1.8em;color:#58a6ff}
.updated{text-align:center;color:#8b949e;margin-bottom:24px;font-size:0.85em}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:24px;max-width:1200px;margin:0 auto}
.section{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px}
.section h2{font-size:1.2em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;margin-bottom:10px;transition:border-color .2s}
.card:hover{border-color:#58a6ff}
.card .title{font-weight:600;margin-bottom:4px;font-size:0.95em}
.card .desc{color:#8b949e;font-size:0.85em;margin-bottom:6px}
.card a{color:#58a6ff;text-decoration:none;font-size:0.8em;word-break:break-all}
.card a:hover{text-decoration:underline}
.tag{display:inline-block;font-size:0.7em;padding:2px 8px;border-radius:12px;margin-right:4px}
.tag-news{background:#1f3a2a;color:#3fb950}
.tag-video{background:#2a1f3a;color:#a371f7}
</style>
</head>
<body>
<h1>📊 每日資訊儀表板</h1>
<p class="updated" id="updated"></p>
<div class="sections" id="content"></div>
<script>
fetch('data.json').then(r=>r.json()).then(data=>{
  document.getElementById('updated').textContent='最後更新：'+data.updated;
  const c=document.getElementById('content');
  data.sections.forEach(s=>{
    let html=`<div class="section"><h2>${s.icon} ${s.title}</h2>`;
    s.items.forEach(item=>{
      const tag=item.type==='video'?'<span class="tag tag-video">影片</span>':'<span class="tag tag-news">新聞</span>';
      html+=`<div class="card">${tag}<div class="title">${item.title}</div><div class="desc">${item.desc||''}</div><a href="${item.url}" target="_blank">${item.url}</a></div>`;
    });
    html+='</div>';
    c.innerHTML+=html;
  });
});
</script>
</body>
</html>
