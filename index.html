<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日資訊儀表板</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--card-bg:#0d1117}
[data-theme="light"]{--bg:#f6f8fa;--surface:#fff;--border:#d0d7de;--text:#1f2328;--muted:#656d76;--accent:#0969da;--card-bg:#f0f3f6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px;min-height:100vh;transition:background .3s,color .3s}
header{max-width:1200px;margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
h1{font-size:36px;color:var(--accent)}
.header-right{display:flex;align-items:center;gap:8px}
.theme-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:1em}
.search-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:var(--text);font-size:0.9em;width:200px}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;max-width:1200px;margin:0 auto 16px}
.date-nav{display:flex;align-items:center;gap:8px}
.date-nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer}
.date-nav button:hover{border-color:var(--accent)}
.date-nav span{font-size:16px;min-width:110px;text-align:center}
#datePicker{font-size:16px;min-width:110px;text-align:center;background:transparent;border:none;color:var(--text);cursor:pointer;font-family:inherit;position:relative}
#datePicker::-webkit-calendar-picker-indicator{opacity:0;position:absolute;left:0;top:0;width:100%;height:100%;cursor:pointer}
.tabs{display:flex;gap:3px;background:var(--surface);border-radius:8px;padding:3px;border:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:14px;border:none;color:var(--muted);background:transparent;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){color:var(--text)}
.stats{max-width:1200px;margin:0 auto 16px;display:flex;gap:12px;flex-wrap:wrap}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:16px;color:var(--muted)}
.stat-card strong{color:var(--text);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:1200px;margin:0 auto}
.card{background:#1c2128;border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s,transform .2s;cursor:pointer;text-decoration:none;color:inherit;display:block;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-body{padding:10px 12px}
.card-body .source{color:var(--muted);font-size:12px;margin-top:4px}
.card-body .title{font-weight:600;font-size:16px;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-body .desc{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:14px;padding:2px 6px;border-radius:10px;margin-bottom:4px}
.tag-news{background:#1f3a2a;color:#3fb950}
.tag-video{background:#2a1f3a;color:#a371f7}
[data-theme="light"] .tag-news{background:#dafbe1;color:#1a7f37}
[data-theme="light"] .tag-video{background:#ede3fb;color:#8250df}
.bookmark-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.bookmark-btn.saved{background:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:1em;grid-column:1/-1}
.heat{display:inline-block;font-size:12px;margin-left:4px;color:#f0883e}
.stock-briefing{max-width:1200px;margin:0 auto 16px;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:16px 20px}
.stock-briefing h2{font-size:20px;color:var(--accent);margin-bottom:12px}
.stock-briefing .sb-section{margin-bottom:10px}
.stock-briefing .sb-label{font-size:18px;font-weight:600;color:var(--text);margin-bottom:4px}
.stock-briefing .sb-item{font-size:16px;color:var(--text);padding:3px 0;border-bottom:1px solid var(--border)}
.stock-briefing .sb-item .trend-up{color:#f85149}
.stock-briefing .sb-item .trend-down{color:#3fb950}
.stock-briefing .sb-item .trend-flat{color:var(--muted)}
.stock-briefing .sb-summary{font-size:16px;color:var(--muted);margin-top:8px;padding:8px;background:var(--bg);border-radius:6px}
.stock-briefing .sb-event{font-size:16px;color:#d29922;padding:2px 0}
.stock-briefing .sparkline{margin:8px 0;padding:8px;background:var(--bg);border-radius:6px}
.stock-briefing .sparkline svg{width:100%;height:40px}
.sb-dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.sb-panel{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}
.sb-panel-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:6px}
.sb-panel-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid rgba(48,54,61,0.3)}
.sb-panel-row .name{color:var(--text)}
.sb-panel-row .val-up{color:#f85149}
.sb-panel-row .val-down{color:#3fb950}
.sb-panel-row .val-flat{color:var(--muted)}
.sb-market-header{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.sb-market-header .idx{font-size:24px;font-weight:700;color:var(--text)}
.sb-market-header .chg-up{font-size:16px;color:#f85149}
.sb-market-header .chg-down{font-size:16px;color:#3fb950}
.sb-chart{position:relative;width:100%;height:80px;margin:8px 0;background:var(--bg);border-radius:6px;overflow:hidden}
.sb-chart svg{width:100%;height:100%}
.sb-chart .y-labels{position:absolute;top:0;left:4px;height:100%;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--muted);pointer-events:none}
.sb-chart .x-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:2px 4px 0;margin-top:6px;gap:4px}
.sb-market-footer{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.sb-market-footer span{color:var(--text)}
.sb-sentiment{text-align:center;padding:8px}
.sb-sentiment .score{font-size:28px;font-weight:700}
.sb-sentiment .label{font-size:12px;color:var(--muted)}
.sb-sentiment .gauge{position:relative;width:200px;height:100px;margin:0 auto 8px;overflow:hidden}
.sb-sentiment .gauge svg{width:100%;height:100%}
.sb-sentiment .history{margin-top:8px}
.sb-sentiment .history svg{width:100%;height:30px}
.loading{text-align:center;padding:40px;grid-column:1/-1}
.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.back-top{position:fixed;bottom:24px;right:24px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.3);z-index:99}
.back-top.show{display:flex}
.sb-toggle{background:none;border:none;color:var(--accent);cursor:pointer;font-size:1.2em;margin-left:8px;vertical-align:middle}
.sb-content.collapsed{display:none}
.watchlist{margin-bottom:10px;padding:8px;background:var(--bg);border-radius:6px}
.watchlist-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.watchlist-header span{font-size:14px;color:var(--accent)}
.watchlist-add{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:4px;font-size:14px;cursor:pointer;margin-left:8px}
.watchlist-item{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px 8px;margin:2px;font-size:13px;color:var(--text)}
.watchlist-item .remove{cursor:pointer;margin-left:4px;color:var(--muted)}
.sb-item .remove{cursor:pointer;margin-left:8px;color:var(--muted);font-size:14px;float:right}
.sb-item .remove:hover{color:#f85149}
.cat-summary{max-width:1200px;margin:0 auto 12px;padding:12px 16px;background:var(--surface);border-left:3px solid var(--accent);border-radius:6px;font-size:14px;color:var(--muted)}
@media(max-width:768px){
h1{font-size:28px}
.search-box{font-size:14.4px;width:100%}
.theme-btn{font-size:16px}
.date-nav span{font-size:16px}
.tab{font-size:14px;padding:10px 18px}
.stat-card{font-size:16px}
.stat-card strong{font-size:18px}
.card-body .title{font-size:16px}
.card-body .desc{font-size:14px}
.tag{font-size:14px}
.heat{font-size:12px}
.bookmark-btn{font-size:16px}
.empty{font-size:16px}
.stock-briefing{padding:12px}
.stock-briefing h2{font-size:20px}
.stock-briefing .sb-label{font-size:18px}
.stock-briefing .sb-item{font-size:16px}
.stock-briefing .sb-event{font-size:16px}
.stock-briefing .sb-summary{font-size:16px}
.grid{gap:8px}
.sb-dashboard{grid-template-columns:1fr}
.stock-briefing{padding:12px}
.sb-panel{padding:10px}
.sb-market-header .idx{font-size:20px}
.sb-chart{height:60px}
.sb-sentiment .gauge{width:280px!important;height:140px!important}
.sb-sentiment .score{font-size:32px}
.watchlist{overflow:visible;max-height:none}
.sb-item{flex-wrap:wrap;word-break:break-word}
}
</style>
</head>
<body>
<header>
  <h1 onclick="location.reload()" style="cursor:pointer">📊 每日資訊儀表板</h1>
  <div class="header-right">
    <input class="search-box" id="search" placeholder="🔍 搜尋..." />
    <button class="theme-btn" id="themeToggle">🌙</button>
  </div>
</header>
<div class="controls">
  <div class="date-nav">
    <button id="prev">◀</button>
    <input type="date" id="datePicker" />
    <button id="next">▶</button>
  </div>
  <div class="tabs" id="tabsContainer">
    <button class="tab active" data-tab="ai">🤖 AI</button>
    <button class="tab" data-tab="gaming">🎮 遊戲</button>
    <button class="tab" data-tab="art">🎨 美術</button>
    <button class="tab" data-tab="tech">💻 科技</button>
    <button class="tab" data-tab="crypto">🪙 加密貨幣</button>
    <button class="tab" data-tab="dev">⚙️ 程式開發</button>
    <button class="tab" data-tab="design">🎨 設計</button>
    <button class="tab" data-tab="business">💼 商業</button>
    <button class="tab" data-tab="finance">📈 財經</button>
    <button class="tab" data-tab="bookmarks">⭐ 收藏</button>
  </div>
</div>
<div class="stats" id="stats"></div>
<div id="stockBriefing"></div>
<div id="catSummary"></div>
<div class="grid" id="content"><div class="loading"><div class="spinner"></div></div></div>
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">▲</button>
<script>
let dates=[],dateIdx=0,currentTab='ai',cache={},bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'[]'),searchQuery='',watchlist=JSON.parse(localStorage.getItem('watchlist')||'[]').filter(w=>typeof w==='string'&&w);
const SHEET_ID='1ySPqQQLJRYIPVhuugm30mHF-GCNk-DXVKWvUirjoJqg';
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbw3z41uOGWQOU_uLtaFUSAld73oUb7cbQyaYTlgDpgwkBGSbXrrqDYEoKpRw-9qZv40/exec';
async function loadWatchlistFromSheet(){try{const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),5000);const res=await fetch('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet=Watchlist&t='+Date.now(),{signal:ctrl.signal,cache:'no-store'});if(res.ok){const csv=await res.text();const items=csv.split('\n').map(r=>{const col=r.split(',')[0]||'';return col.replace(/^"|"$/g,'').replace(/^'/,'').trim()}).filter(r=>r&&r!=='name'&&r.length>0);if(items.length){const merged=new Set([...watchlist,...items]);watchlist=[...merged].filter(w=>typeof w==='string'&&w);localStorage.setItem('watchlist',JSON.stringify(watchlist))}}}catch(e){console.log('Sheet read failed, using localStorage')}}
async function saveWatchlistToSheet(){try{fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'saveWatchlist',watchlist})})}catch(e){console.log('Sheet save failed')}}
function addToWatchlist(){const name=prompt('輸入股票名稱或代號（如：0056、台積電）');if(name&&name.trim()&&!watchlist.includes(name.trim())){watchlist.push(name.trim());localStorage.setItem('watchlist',JSON.stringify(watchlist));saveWatchlistToSheet();const el=document.getElementById('stockBriefing');if(el){const msg=document.createElement('div');msg.style.cssText='text-align:center;padding:8px;color:var(--accent);font-size:14px';msg.textContent='🔍 已新增「'+name.trim()+'」，搜尋資料中...';el.prepend(msg);fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'requestUpdate',stock:name.trim()})});setTimeout(()=>{msg.textContent='✅ 已新增「'+name.trim()+'」，資料將於下次更新時顯示';setTimeout(()=>msg.remove(),3000)},2000)}render()}}
function removeFromWatchlist(name){watchlist=watchlist.filter(w=>w!==name);localStorage.setItem('watchlist',JSON.stringify(watchlist));saveWatchlistToSheet();render()}
function getHeat(title){let h=0;for(let i=0;i<title.length;i++)h=((h<<5)-h)+title.charCodeAt(i);return Math.abs(h%5)+1}
function trendArrow(t){const isUp=t.includes('漲')||t.includes('多');const isDown=t.includes('跌')||t.includes('空');const desc=t.replace(/^[漲跌平]\s*/,'');return{cls:isUp?'val-up':isDown?'val-down':'val-flat',arrow:isUp?'▲':isDown?'▼':'▬',tcls:isUp?'trend-up':isDown?'trend-down':'trend-flat',desc:desc}}
function toggleBookmark(item,e){
  e.preventDefault();e.stopPropagation();
  const idx=bookmarks.findIndex(b=>b.url===item.url);
  if(idx>=0)bookmarks.splice(idx,1);else bookmarks.push(item);
  localStorage.setItem('bookmarks',JSON.stringify(bookmarks));
  render();
}
function isBookmarked(url){return bookmarks.some(b=>b.url===url)}
async function init(){
  try{
    const res=await fetch('data/index.json');
    if(!res.ok)throw new Error('無法載入索引');
    dates=(await res.json()).sort().reverse();
    if(!dates.length){document.getElementById('content').innerHTML='<div class="empty">尚無資料</div>';return}
    const today=new Date().toISOString().split('T')[0];
    const todayIdx=dates.indexOf(today);
    dateIdx=todayIdx>=0?todayIdx:0;
    await loadWatchlistFromSheet();
    render();
  }catch(e){document.getElementById('content').innerHTML='<div class="empty">載入失敗：'+e.message+'<br><button onclick="init()" style="margin-top:8px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer">重試</button></div>'}
}
async function loadDate(d){
  if(!cache[d]){
    const res=await fetch('data/'+d+'.json');
    if(!res.ok)throw new Error('無法載入 '+d+' 資料');
    cache[d]=await res.json();
  }
  return cache[d];
}
async function renderStockBriefing(cats){
  const el=document.getElementById('stockBriefing');
  if(currentTab!=='finance'||!cats||!cats.stock_briefing){el.innerHTML='';return}
  const sb=cats.stock_briefing;
  let h='<div class="stock-briefing"><h2>📊 台股操盤 — '+sb.date+'<button class="sb-toggle" onclick="var c=document.getElementById(\'sbContent\');c.classList.toggle(\'collapsed\');this.textContent=c.classList.contains(\'collapsed\')?\'▶\':\'▼\'">▼</button></h2><div id="sbContent" class="sb-content">';
  if(watchlist.length){try{h+='<div class="watchlist"><div class="watchlist-header"><span>⭐ 追蹤清單</span><span><button class="watchlist-add" onclick="loadWatchlistFromSheet().then(render)" title="重新載入">🔄</button><button class="watchlist-add" onclick="addToWatchlist()">+ 新增</button></span></div>';const allStocks=(sb.stocks||[]).concat(sb.etf||[]);for(const w of watchlist){const wStr=String(w).trim();const del='<span class="remove" onclick="event.stopPropagation();removeFromWatchlist(\''+wStr.replace(/'/g,"\\'")+'\')">✕</span>';const matchFn=s=>{const code=s.name.split(/[\s(（]/)[0];return code===wStr||s.name.startsWith(wStr+' ')||s.name.startsWith(wStr+'(')||s.name.includes(wStr)&&wStr.length>=4};const found=allStocks.find(matchFn);if(found){const ta=trendArrow(found.trend);h+='<div class="sb-item"><span class="'+ta.tcls+'">'+ta.arrow+' '+found.name+'</span> — '+found.note+' <span style="font-size:12px;color:var(--muted)">(今日)</span> '+del+'</div>'}else{let hist=null,histDate='';for(let i=1;i<dates.length&&i<7;i++){try{const pd=await loadDate(dates[dateIdx+i]);const pc=(pd.categories||pd);const psb=pc.stock_briefing;if(psb){const ps=(psb.stocks||[]).concat(psb.etf||[]);const pf=ps.find(matchFn);if(pf){hist=pf;histDate=dates[dateIdx+i];break}}}catch(e){}}if(hist){const ta=trendArrow(hist.trend);h+='<div class="sb-item"><span class="'+ta.tcls+'">'+ta.arrow+' '+hist.name+'</span> — '+hist.note+' <span style="font-size:12px;color:var(--muted)">(更新：'+histDate+')</span> '+del+'</div>'}else{h+='<div class="sb-item">'+wStr+' — <span style="color:var(--muted)">'+(sb.searched&&sb.searched.includes(wStr)?'查無此個股':'暫無資訊，將在下次更新時補充')+'</span> '+del+'</div>'}}};h+='</div>'}catch(we){console.error('watchlist error:',we);h+='<div class="watchlist"><div style="font-size:13px;color:#f85149">追蹤清單載入失敗</div><button class="watchlist-add" onclick="loadWatchlistFromSheet().then(render)">🔄 重新載入</button></div>'}}else{h+='<div class="watchlist"><div class="watchlist-header"><span>⭐ 追蹤清單</span><span><button class="watchlist-add" onclick="loadWatchlistFromSheet().then(render)" title="重新載入">🔄</button><button class="watchlist-add" onclick="addToWatchlist()">+ 新增</button></span></div><div style="font-size:13px;color:var(--muted)">尚未設定追蹤標的</div></div>'}
  h+='<div class="sb-dashboard">';
  // Panel 1: Market Overview with chart
  if(sb.market){const m=sb.market;const chgCls=m.change>=0?'chg-up':'chg-down';h+='<div class="sb-panel"><div class="sb-panel-title">📈 市場總覽</div><div class="sb-market-header"><span class="idx">'+m.index+'</span><span class="'+chgCls+'">'+(m.change>=0?'+':'')+m.change+' ('+m.changePercent+')</span></div>';if(sb.sparkline&&sb.sparkline.length>1){const pts=sb.sparkline,min=Math.min(...pts),max=Math.max(...pts),range=max-min||1,w=600,ht=140,pad=0;const labels=sb.sparkline_dates||[];let pathD='M0,'+(ht-(pts[0]-min)/range*ht);let areaD='M0,'+ht+' L0,'+(ht-(pts[0]-min)/range*ht);pts.forEach((p,i)=>{const x=i/(pts.length-1)*w,y=ht-(p-min)/range*ht;if(i>0)pathD+=' L'+x+','+y;areaD+=' L'+x+','+y});areaD+=' L'+w+','+ht+' Z';const gridLines=5;let gridH='';for(let i=0;i<=gridLines;i++){const gy=i/gridLines*ht;gridH+='<line x1="0" y1="'+gy+'" x2="'+w+'" y2="'+gy+'" stroke="rgba(48,54,61,0.5)" stroke-width="0.5"/>'}h+='<div class="sb-chart"><div class="y-labels"><span>'+max.toLocaleString()+'</span><span>'+Math.round((max+min)/2).toLocaleString()+'</span><span>'+min.toLocaleString()+'</span></div><svg viewBox="0 0 '+w+' '+ht+'" preserveAspectRatio="none">'+gridH+'<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#58a6ff" stop-opacity="0.3"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0.02"/></linearGradient></defs><path d="'+areaD+'" fill="url(#areaGrad)"/><path d="'+pathD+'" fill="none" stroke="#58a6ff" stroke-width="2"/></svg></div>';if(labels.length){h+='<div class="sb-chart .x-labels">';labels.forEach((l,i)=>{if(i%5===0||i===labels.length-1)h+='<span>'+l+'</span>'});h+='</div>'}}h+='<div class="sb-market-footer">成交量：<span>'+m.volume+'</span>'+(m.futures?' | 期貨：<span>'+m.futures+'</span>':'')+'</div></div>'}
  // Panel 2: Sector Top
  if(sb.sectors&&sb.sectors.length){h+='<div class="sb-panel"><div class="sb-panel-title">🏭 類股漲跌</div>';sb.sectors.forEach(s=>{const cls=s.change>=0?'val-up':'val-down';h+='<div class="sb-panel-row"><span class="name">'+s.name+'</span><span class="'+cls+'">'+(s.change>=0?'+':'')+s.change+'%</span></div>'});h+='</div>'}
  // Panel 3: Stock Top
  if(sb.stocks&&sb.stocks.length){h+='<div class="sb-panel"><div class="sb-panel-title">💪 個股強弱</div>';sb.stocks.forEach(s=>{const ta=trendArrow(s.trend);h+='<div class="sb-panel-row"><span class="name">'+s.name+'</span><span class="'+ta.cls+'">'+ta.arrow+' '+ta.desc+'</span></div>'});h+='</div>'}
  // Panel 4: ETF
  if(sb.etf&&sb.etf.length){h+='<div class="sb-panel"><div class="sb-panel-title">📊 ETF 趨勢</div>';sb.etf.forEach(s=>{const ta=trendArrow(s.trend);h+='<div class="sb-panel-row"><span class="name">'+s.name+'</span><span class="'+ta.cls+'">'+ta.arrow+' '+ta.desc+'</span></div>'});h+='</div>'}
  // Panel 5: Institutional
  if(sb.institutional){const inst=sb.institutional;h+='<div class="sb-panel"><div class="sb-panel-title">🏦 法人籌碼</div>';Object.keys(inst).forEach(k=>{const v=inst[k];const cls=v>=0?'val-up':'val-down';h+='<div class="sb-panel-row"><span class="name">'+k+'</span><span class="'+cls+'">'+(v>=0?'+':'')+v+'億</span></div>'});h+='</div>'}
  // Panel 6: Sentiment Gauge
  if(sb.sentiment){const s=sb.sentiment;const color=s.score>=75?'#f85149':s.score>=50?'#d29922':s.score>=25?'#3fb950':'#8b949e';const cx=80,cy=80,r=55;function arcPt(deg){return[cx+r*Math.cos(deg*Math.PI/180),cy-r*Math.sin(deg*Math.PI/180)]}const a0=arcPt(180),a1=arcPt(135),a2=arcPt(90),a3=arcPt(45),a4=arcPt(0);h+='<div class="sb-panel"><div class="sb-panel-title">🎯 市場情緒</div><div class="sb-sentiment"><div class="gauge"><svg viewBox="0 0 160 90"><path d="M'+a0[0]+','+a0[1]+' A'+r+','+r+' 0 0,1 '+a1[0]+','+a1[1]+'" fill="none" stroke="#8b949e" stroke-width="10" stroke-linecap="round"/><path d="M'+a1[0]+','+a1[1]+' A'+r+','+r+' 0 0,1 '+a2[0]+','+a2[1]+'" fill="none" stroke="#3fb950" stroke-width="10" stroke-linecap="round"/><path d="M'+a2[0]+','+a2[1]+' A'+r+','+r+' 0 0,1 '+a3[0]+','+a3[1]+'" fill="none" stroke="#d29922" stroke-width="10" stroke-linecap="round"/><path d="M'+a3[0]+','+a3[1]+' A'+r+','+r+' 0 0,1 '+a4[0]+','+a4[1]+'" fill="none" stroke="#f85149" stroke-width="10" stroke-linecap="round"/><line x1="80" y1="80" x2="35" y2="80" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" transform="rotate('+(s.score/100*180)+',80,80)"/><circle cx="80" cy="80" r="4" fill="var(--text)"/><text x="5" y="85" font-size="12" fill="var(--muted)">0</text><text x="145" y="85" font-size="12" fill="var(--muted)">100</text></svg></div><div class="score" style="color:'+color+'">'+s.score+'</div><div class="label">'+s.label+'</div>';if(s.history&&s.history.length>1){const pts=s.history,min=Math.min(...pts),max=Math.max(...pts),rng=max-min||1;let lp='M0,'+(30-(pts[0]-min)/rng*28);pts.forEach((p,i)=>{if(i>0)lp+=' L'+(i/(pts.length-1)*160)+','+(30-(p-min)/rng*28)});h+='<div class="history"><svg viewBox="0 0 160 30" preserveAspectRatio="none"><path d="'+lp+'" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg><div style="font-size:10px;color:var(--muted)">過去一週情緒指數</div></div>'}h+='</div></div>'}
  // Panel 7: International
  if(sb.international&&sb.international.length){h+='<div class="sb-panel"><div class="sb-panel-title">🌍 國際市場</div>';sb.international.forEach(m=>{const cls=m.change>=0?'val-up':'val-down';h+='<div class="sb-panel-row"><span class="name">'+m.name+'</span><span class="'+cls+'">'+(m.change>=0?'+':'')+m.change+'%</span></div>'});h+='</div>'}
  // Panel 8: Events
  if(sb.events&&sb.events.length){h+='<div class="sb-panel" style="grid-column:1/-1"><div class="sb-panel-title">⚡ 焦點訊息</div>';sb.events.forEach(e=>{h+='<div class="sb-event">• '+e+'</div>'});h+='</div>'}
  h+='</div>';
  // Summary
  if(sb.summary){h+='<div class="sb-section"><div class="sb-label">整體評估</div><div class="sb-summary">'+sb.summary+'</div></div>'}
  h+='</div></div>';el.innerHTML=h;
}
function renderStats(cats){
  let news=0,videos=0;
  Object.keys(cats).forEach(k=>{if(Array.isArray(cats[k]))cats[k].forEach(i=>{if(i.type==='video')videos++;else news++})});
  document.getElementById('stats').innerHTML=`<div class="stat-card">📰 新聞 <strong>${news}</strong></div><div class="stat-card">🎬 影片 <strong>${videos}</strong></div><div class="stat-card">⭐ 收藏 <strong>${bookmarks.length}</strong></div>`;
}
async function render(){
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div></div>';
  try{
  const d=dates[dateIdx];
  document.getElementById('datePicker').value=d;
  document.getElementById('prev').disabled=dateIdx>=dates.length-1;
  document.getElementById('next').disabled=dateIdx<=0;
  let items;
  if(currentTab==='bookmarks'){items=bookmarks}
  else{const data=await loadDate(d);const cats=data.categories||data;items=cats[currentTab]||[];if(currentTab==='ai'&&cats.ai_videos)items=items.concat(cats.ai_videos);renderStats(cats);await renderStockBriefing(cats);const sumEl=document.getElementById('catSummary');if(cats.summaries&&cats.summaries[currentTab]){sumEl.innerHTML='<div class="cat-summary">💡 '+cats.summaries[currentTab]+'</div>'}else{sumEl.innerHTML=''}}
  if(searchQuery){const q=searchQuery.toLowerCase();items=items.filter(i=>(i.title+' '+(i.desc||'')).toLowerCase().includes(q))}
  if(!items.length){document.getElementById('content').innerHTML='<div class="empty">'+(currentTab==='bookmarks'?'尚無收藏':'該分類尚無資料')+'</div>';return}
  let html='';
  items.forEach(item=>{
    const tag=item.type==='video'?'<span class="tag tag-video">影片</span>':'<span class="tag tag-news">新聞</span>';
    const bm=isBookmarked(item.url)?'saved':'';
    const heat='🔥'.repeat(getHeat(item.title));
    const src=item.source?'<div class="source">'+item.source+'</div>':'';
    html+=`<a class="card" href="${item.url}" target="_blank"><button class="bookmark-btn ${bm}" onclick="toggleBookmark(${JSON.stringify(item).replace(/"/g,'&quot;')},event)">⭐</button><div class="card-body">${tag}<span class="heat">${heat}</span><div class="title">${item.title}</div><div class="desc">${item.desc||''}</div>${src}</div></a>`;
  });
  document.getElementById('content').innerHTML=html;
  }catch(err){document.getElementById('content').innerHTML='<div class="empty">渲染錯誤：'+err.message+'</div>';console.error(err)}
}
document.getElementById('prev').onclick=e=>{e.stopPropagation();if(dateIdx<dates.length-1){dateIdx++;render()}};
document.getElementById('next').onclick=e=>{e.stopPropagation();if(dateIdx>0){dateIdx--;render()}};
document.getElementById('datePicker').onchange=e=>{const idx=dates.indexOf(e.target.value);if(idx>=0){dateIdx=idx;render()}};
window.onscroll=()=>{document.getElementById('backTop').classList.toggle('show',window.scrollY>300)};
document.getElementById('tabsContainer').onclick=e=>{
  if(!e.target.classList.contains('tab'))return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  e.target.classList.add('active');
  currentTab=e.target.dataset.tab;
  render();
};
document.getElementById('search').oninput=e=>{searchQuery=e.target.value;render()};
document.getElementById('themeToggle').onclick=()=>{
  const html=document.documentElement;
  const isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',isDark?'light':'dark');
  document.getElementById('themeToggle').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('theme',isDark?'light':'dark');
};
if(localStorage.getItem('theme')==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeToggle').textContent='☀️'}
init();
</script>
